name: Compilar versión de escritorio (Windows)

on:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'sprites/**', 'icons/**', 'desktop/**', '.github/workflows/escritorio.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritorio
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar la aplicación (carpeta win-unpacked)
        run: npm run preparar && npx electron-builder --win dir --publish never
      - name: Probar que el juego abre en Windows
        run: MDR_SMOKE=1 timeout 90 "dist/win-unpacked/Mar de Recompensas.exe"
      - name: Empaquetar en .zip
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/MarDeRecompensas-Windows.zip" -Force
      - name: Crear MarDeRecompensas.exe portable (con reintentos)
        continue-on-error: true
        run: |
          for i in 1 2 3 4; do
            npx electron-builder --win portable --prepackaged dist/win-unpacked --publish never && exit 0
            echo "Intento $i fallido (descarga de herramientas). Reintentando en $((i*20)) s..."; sleep $((i*20))
          done
          exit 1
      - name: Publicar en la página de descargas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Versión para Windows de Mar de Recompensas (commit ${GITHUB_SHA::7}). MarDeRecompensas.exe: se abre directamente, sin instalar. MarDeRecompensas-Windows.zip: descomprímelo y abre 'Mar de Recompensas.exe'. Se actualiza sola con cada cambio del juego."
          if gh release view escritorio >/dev/null 2>&1; then
            gh release edit escritorio --notes "$NOTAS"
          else
            gh release create escritorio --title "Mar de Recompensas para Windows" --notes "$NOTAS" --latest
          fi
          gh release upload escritorio dist/MarDeRecompensas-Windows.zip --clobber
          if [ -f dist/MarDeRecompensas.exe ]; then gh release upload escritorio dist/MarDeRecompensas.exe --clobber; fi
