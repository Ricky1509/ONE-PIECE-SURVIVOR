name: Compilar versión de escritorio (Windows)

on:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'sprites/**', 'icons/**', 'desktop/**', '.github/workflows/escritorio.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritorio
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar la aplicación (carpeta win-unpacked)
        run: npm run preparar && npx electron-builder --win dir --publish never
      - name: Probar que el juego abre en Windows
        run: MDR_SMOKE=1 timeout 90 "dist/win-unpacked/Mar de Recompensas.exe"
      - name: Empaquetar en .zip
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/MarDeRecompensas-Windows.zip" -Force
      - name: Empaquetar versión web para itch.io
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force -Path itch | Out-Null
          Copy-Item -Recurse index.html, manifest.webmanifest, sw.js, js, sprites, icons -Destination itch
          Compress-Archive -Path "itch/*" -DestinationPath "desktop/dist/MarDeRecompensas-Web.zip" -Force
      - name: Crear MarDeRecompensas.exe portable (con reintentos)
        continue-on-error: true
        run: |
          for i in 1 2 3 4; do
            npx electron-builder --win portable --prepackaged dist/win-unpacked --publish never && exit 0
            echo "Intento $i fallido (descarga de herramientas). Reintentando en $((i*20)) s..."; sleep $((i*20))
          done
          exit 1
      - name: Publicar en la página de descargas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Mar de Recompensas (commit ${GITHUB_SHA::7}). MarDeRecompensas.exe: Windows, se abre directamente. MarDeRecompensas-Windows.zip: descomprímelo y abre 'Mar de Recompensas.exe'. MarDeRecompensas-Web.zip: versión web lista para subir a itch.io (HTML). Se actualiza sola con cada cambio del juego."
          # Reintenta ante errores temporales de la API de GitHub (500/502/503)
          intentar() { for i in 1 2 3 4 5; do "$@" && return 0; echo "Fallo temporal ($i). Reintentando en $((i*15)) s..."; sleep $((i*15)); done; return 1; }
          if gh release view escritorio >/dev/null 2>&1; then
            intentar gh release edit escritorio --notes "$NOTAS"
          else
            intentar gh release create escritorio --title "Mar de Recompensas para Windows" --notes "$NOTAS" --latest
          fi
          intentar gh release upload escritorio dist/MarDeRecompensas-Windows.zip --clobber
          intentar gh release upload escritorio dist/MarDeRecompensas-Web.zip --clobber
          if [ -f dist/MarDeRecompensas.exe ]; then intentar gh release upload escritorio dist/MarDeRecompensas.exe --clobber; fi
